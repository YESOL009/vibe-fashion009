{% extends "base.html" %}

{% block title %}이메일 인증 확인 중 | {{ brand_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h4 class="fw-bold mb-2">이메일 인증 확인 중</h4>
                <p class="text-muted small mb-0">인증 정보를 확인하고 있습니다. 잠시만 기다려주세요...</p>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    // URL의 해시(#) 파라미터 파싱 (Supabase Implicit Grant redirect: #access_token=...&refresh_token=...&type=signup / recovery)
    const hash = window.location.hash.substring(1);
    if (hash) {
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        const type = params.get('type') || 'signup';
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        if (error) {
            window.location.href = "{{ url_for('auth.login') }}?error=confirm_failed";
            return;
        }

        if (accessToken) {
            // 세션 저장을 위해 서버로 전송
            fetch("{{ url_for('auth.session_callback') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    access_token: accessToken,
                    refresh_token: refreshToken,
                    type: type
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect_url || "{{ url_for('main.mypage') }}";
                } else {
                    window.location.href = "{{ url_for('auth.login') }}?error=confirm_failed";
                }
            })
            .catch(() => {
                window.location.href = "{{ url_for('auth.login') }}?error=confirm_failed";
            });
            return;
        }
    }

    // 만약 해시가 없다면 로그인 페이지로 안내
    setTimeout(function() {
        window.location.href = "{{ url_for('auth.login') }}?success=already_confirmed";
    }, 1500);
})();
</script>
{% endblock %}
