{% extends "base.html" %}

{% block title %}새 비밀번호 설정 | {{ brand_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <span class="badge bg-warning text-dark px-3 py-1 rounded-pill small mb-2">보안 설정</span>
                    <h2 class="fw-black mb-1">새 비밀번호 설정</h2>
                    <p class="text-muted small">새롭게 사용할 비밀번호를 입력해주세요.</p>
                </div>

                <!-- 에러 알림 -->
                {% if error %}
                <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3" role="alert">
                    <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
                </div>
                {% endif %}

                <!-- 성공 알림 -->
                {% if success %}
                <div class="alert alert-success py-2 px-3 small rounded-3 mb-3" role="alert">
                    <i class="bi bi-check-circle me-1"></i>{{ success }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.reset_password') }}">
                    <input type="hidden" name="access_token" id="hidden_access_token" value="">
                    <input type="hidden" name="refresh_token" id="hidden_refresh_token" value="">
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">새 비밀번호</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="6자리 이상 비밀번호" required minlength="6">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password_confirm" class="form-label fw-semibold small">새 비밀번호 확인</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password_confirm" name="password_confirm" placeholder="새 비밀번호 다시 입력" required minlength="6">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold py-3 shadow-sm">
                            비밀번호 변경 완료
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        <a href="{{ url_for('auth.login') }}" class="text-dark fw-bold text-decoration-none hover-warning">
                            <i class="bi bi-arrow-left"></i> 로그인 페이지로 돌아가기
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    // URL에 해시(#access_token=...&type=recovery)가 직접 넘어온 경우 토큰 보존 및 세션 동기화
    const hash = window.location.hash.substring(1);
    if (hash) {
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        if (accessToken) {
            const inputAccess = document.getElementById('hidden_access_token');
            const inputRefresh = document.getElementById('hidden_refresh_token');
            if (inputAccess) inputAccess.value = accessToken;
            if (inputRefresh && refreshToken) inputRefresh.value = refreshToken;

            // 백엔드 세션도 자동 동기화
            fetch("{{ url_for('auth.session_callback') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    access_token: accessToken,
                    refresh_token: refreshToken,
                    type: "recovery"
                })
            }).catch(() => {});
        }
    }
})();
</script>
{% endblock %}
