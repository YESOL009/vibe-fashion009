{% extends "base.html" %}

{% block title %}비밀번호 찾기 | {{ brand_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <span class="badge bg-secondary text-white px-3 py-1 rounded-pill small mb-2">계정 찾기</span>
                    <h2 class="fw-black mb-1">비밀번호 찾기</h2>
                    <p class="text-muted small">가입하신 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>
                </div>

                <!-- URL 파라미터 에러 메시지 -->
                {% if error %}
                <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3" role="alert">
                    <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
                </div>
                {% endif %}

                <!-- URL 파라미터 성공 메시지 -->
                {% if success %}
                <div class="alert alert-success py-2 px-3 small rounded-3 mb-3" role="alert">
                    <i class="bi bi-check-circle me-1"></i>{{ success }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold small">가입 이메일</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="example@vibe-fashion.com" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold py-3 shadow-sm">
                            재설정 링크 받기
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        기억나셨나요? 
                        <a href="{{ url_for('auth.login') }}" class="text-dark fw-bold text-decoration-none hover-warning ms-1">
                            로그인하기 <i class="bi bi-arrow-right"></i>
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
